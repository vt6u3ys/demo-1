<!DOCTYPE html>
<html lang="zh-TW" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>個人財務與記帳系統 - 彈性固定收支版</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- SheetJS for Excel Export -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- html2pdf for PDF Export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    :root {
      --bg-body: #f4f6f9;
      --accordion-btn-bg: #e7f1ff;
      --accordion-btn-color: #0c63e4;
    }
    [data-bs-theme="dark"] {
      --bg-body: #121212;
      --accordion-btn-bg: #1e293b;
      --accordion-btn-color: #60a5fa;
    }
    body { 
      background-color: var(--bg-body); 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: background-color 0.3s ease;
    }
    .card-summary { border: none; border-radius: 12px; transition: transform 0.2s; }
    .card-summary:hover { transform: translateY(-3px); }
    .accordion-button:not(.collapsed) { 
      background-color: var(--accordion-btn-bg); 
      color: var(--accordion-btn-color); 
    }
    .badge-bank { background-color: #6f42c1; color: #fff; }
    .badge-fixed-exp { background-color: #fd7e14; color: #fff; }
    .badge-fixed-inc { background-color: #198754; color: #fff; }
    .badge-due-warning { background-color: #dc3545; color: #fff; }
    .badge-due-info { background-color: #0dcaf0; color: #000; }
  </style>
</head>
<body class="py-4">

<div class="container" style="max-width: 1100px;">
  <!-- 頂部標題與工具按鈕 -->
  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <h3 class="fw-bold text-primary mb-0"><i class="fa-solid fa-wallet me-2"></i>個人財務記帳系統</h3>
    <div class="d-flex gap-2 flex-wrap align-items-center">
      <!-- 深淺色主題切換按鈕 -->
      <button class="btn btn-outline-primary btn-sm d-flex align-items-center gap-1" id="themeToggleBtn" onclick="toggleTheme()">
        <i class="fa-solid fa-moon" id="themeIcon"></i>
        <span id="themeText">深色模式</span>
      </button>
      <button class="btn btn-outline-success btn-sm" onclick="exportExcel()"><i class="fa-solid fa-file-excel me-1"></i>匯出 Excel</button>
      <button class="btn btn-outline-danger btn-sm" onclick="exportPDF()"><i class="fa-solid fa-file-pdf me-1"></i>匯出 PDF</button>
      <button class="btn btn-outline-secondary btn-sm" onclick="exportJSON()"><i class="fa-solid fa-download me-1"></i>備份 JSON</button>
      <button class="btn btn-outline-dark btn-sm" onclick="document.getElementById('importFile').click()"><i class="fa-solid fa-upload me-1"></i>還原 JSON</button>
      <input type="file" id="importFile" accept=".json" style="display:none;" onchange="importJSON(event)">
    </div>
  </div>

  <!-- 1. 最上方數據總覽顯示區塊 (四欄資訊看板) -->
  <div class="row g-3 mb-4">
    <div class="col-md-3">
      <div class="card card-summary bg-primary text-white p-3 shadow-sm">
        <div class="small opacity-75">目前總資產</div>
        <div class="fs-3 fw-bold mt-1" id="stat-total-assets">$0</div>
        <div class="small opacity-75 mt-1" id="stat-assets-count">含 0 個帳戶</div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card card-summary bg-danger text-white p-3 shadow-sm">
        <div class="small opacity-75">本月總支出 (<span class="current-month-label"></span>)</div>
        <div class="fs-3 fw-bold mt-1" id="stat-month-expense">$0</div>
        <div class="small opacity-75 mt-1">含日常+信用卡+固定支出</div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card card-summary text-white p-3 shadow-sm" style="background-color: #6f42c1;">
        <div class="small opacity-75">信用卡總未結 / 分期未繳</div>
        <div class="fs-3 fw-bold mt-1" id="stat-credit-unpaid">$0</div>
        <div class="small opacity-75 mt-1" id="stat-credit-count">0 筆分期進行中</div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card card-summary bg-warning text-dark p-3 shadow-sm">
        <div class="small opacity-75">預估月固定支出 / 收入</div>
        <div class="fs-4 fw-bold mt-1">
          <span class="text-danger" id="stat-fixed-monthly-exp">-$0</span> / 
          <span class="text-success" id="stat-fixed-monthly-inc">+$0</span>
        </div>
        <div class="small opacity-75 mt-1">包含每月與年繳/年領平攤</div>
      </div>
    </div>
  </div>

  <!-- 2. 收闔式管理區塊 (CRUD 基礎設定) -->
  <div class="accordion mb-4 shadow-sm" id="setupAccordion">
    <div class="accordion-item border-0 rounded-3">
      <h2 class="accordion-header" id="headingOne">
        <button class="accordion-button collapsed fw-bold rounded-3" type="button" data-bs-toggle="collapse" data-bs-target="#collapseSetup">
          <i class="fa-solid fa-sliders me-2"></i>點擊展開／收闔：管理資產帳戶、信用卡分期與彈性固定收支設定
        </button>
      </h2>
      <div id="collapseSetup" class="accordion-collapse collapse" data-bs-parent="#setupAccordion">
        <div class="accordion-body bg-body-tertiary">
          <div class="row g-4">
            
            <!-- 資產帳戶管理 -->
            <div class="col-md-4">
              <div class="card border-0 bg-body p-3 shadow-sm">
                <h6 class="fw-bold text-primary mb-3"><i class="fa-solid fa-building-columns me-1"></i>資產帳戶 (銀行/現金)</h6>
                <div class="input-group input-group-sm mb-2">
                  <input type="text" id="acc-name" class="form-control" placeholder="帳戶名稱 (如: 台新)">
                  <input type="number" id="acc-bal" class="form-control" placeholder="餘額">
                  <button class="btn btn-primary" onclick="addAccount()"><i class="fa-solid fa-plus"></i></button>
                </div>
                <ul class="list-group list-group-flush small" id="list-accounts"></ul>
              </div>
            </div>

            <!-- 信用卡分期管理 -->
            <div class="col-md-4">
              <div class="card border-0 bg-body p-3 shadow-sm">
                <h6 class="fw-bold mb-3" style="color: #6f42c1;"><i class="fa-solid fa-credit-card me-1"></i>信用卡分期設定</h6>
                <div class="mb-2">
                  <input type="text" id="cc-bank" class="form-control form-control-sm mb-1" placeholder="銀行/卡別 (如: 玉山)">
                  <input type="text" id="cc-title" class="form-control form-control-sm mb-1" placeholder="消費項目 (如: iPhone)">
                  <div class="row g-1 mb-1">
                    <div class="col-6"><input type="number" id="cc-amount" class="form-control form-control-sm" placeholder="總金額"></div>
                    <div class="col-6"><input type="number" id="cc-periods" class="form-control form-control-sm" placeholder="分幾期"></div>
                  </div>
                  <div class="input-group input-group-sm">
                    <span class="input-group-text">起始</span>
                    <input type="month" id="cc-start-month" class="form-control">
                    <button class="btn text-white" style="background-color: #6f42c1;" onclick="addCreditCard()"><i class="fa-solid fa-plus"></i></button>
                  </div>
                </div>
                <ul class="list-group list-group-flush small" id="list-creditcards"></ul>
              </div>
            </div>

            <!-- 彈性固定收支管理 (支援支出/收入) -->
            <div class="col-md-4">
              <div class="card border-0 bg-body p-3 shadow-sm">
                <h6 class="fw-bold text-body mb-3"><i class="fa-solid fa-calendar-check me-1"></i>彈性固定收支設定</h6>
                <div class="mb-2">
                  <div class="row g-1 mb-1">
                    <div class="col-6">
                      <select id="fx-flow-type" class="form-select form-select-sm fw-bold">
                        <option value="expense">🔴 固定支出</option>
                        <option value="income">🟢 固定收入</option>
                      </select>
                    </div>
                    <div class="col-6">
                      <select id="fx-cycle-type" class="form-select form-select-sm" onchange="toggleFxCycleInputs()">
                        <option value="monthly">每月固定日</option>
                        <option value="yearly">每年固定月日</option>
                      </select>
                    </div>
                  </div>

                  <input type="text" id="fx-title" class="form-control form-control-sm mb-1" placeholder="項目 (如: 房租、每月薪資)">
                  <input type="number" id="fx-amount" class="form-control form-control-sm mb-1" placeholder="金額">

                  <!-- 每月特定日期輸入 -->
                  <div id="fx-monthly-group" class="input-group input-group-sm mb-1">
                    <span class="input-group-text">每月</span>
                    <input type="number" id="fx-day" class="form-control" min="1" max="31" placeholder="日期 (1-31)">
                    <span class="input-group-text">日</span>
                  </div>

                  <!-- 每年特定月日輸入 -->
                  <div id="fx-yearly-group" class="input-group input-group-sm mb-1" style="display:none;">
                    <span class="input-group-text">每年</span>
                    <input type="number" id="fx-month-num" class="form-control" min="1" max="12" placeholder="月(1-12)">
                    <span class="input-group-text">月</span>
                    <input type="number" id="fx-day-num" class="form-control" min="1" max="31" placeholder="日(1-31)">
                    <span class="input-group-text">日</span>
                  </div>

                  <button class="btn btn-dark btn-sm w-100 fw-bold mt-1" onclick="addFixedExpense()"><i class="fa-solid fa-plus me-1"></i>新增固定收支</button>
                </div>
                <ul class="list-group list-group-flush small" id="list-fixed"></ul>
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 3. 每月收支明細與 CRUD 區塊 -->
  <div id="pdf-export-area" class="card border-0 shadow-sm p-4 bg-body">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div class="d-flex align-items-center gap-2">
        <h5 class="fw-bold mb-0"><i class="fa-solid fa-list-check me-2"></i>每月收支明細</h5>
        <input type="month" id="selectedMonth" class="form-control form-control-sm w-auto fw-bold" onchange="changeMonth()">
      </div>
      <div>
        <button class="btn btn-primary btn-sm" onclick="openTransactionModal('income')"><i class="fa-solid fa-plus me-1"></i>新增收入</button>
        <button class="btn btn-danger btn-sm" onclick="openTransactionModal('expense')"><i class="fa-solid fa-minus me-1"></i>新增日常支出</button>
      </div>
    </div>

    <!-- 明細表格展示 -->
    <div class="table-responsive">
      <table class="table table-hover align-middle">
        <thead>
          <tr>
            <th>預定/發生日期</th>
            <th>類型 / 來源</th>
            <th>項目說明</th>
            <th>繳費/入帳提醒狀態</th>
            <th class="text-end">金額</th>
            <th class="text-center" width="100">操作</th>
          </tr>
        </thead>
        <tbody id="month-transaction-list">
          <!-- 動態渲染明細內容 -->
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- 新增/編輯收支 Modal -->
<div class="modal fade" id="txModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-bold" id="txModalTitle">記帳</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="txForm">
          <input type="hidden" id="tx-id">
          <input type="hidden" id="tx-type">
          <div class="mb-3">
            <label class="form-label">日期</label>
            <input type="date" id="tx-date" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">項目說明</label>
            <input type="text" id="tx-title" class="form-control" placeholder="例如: 晚餐、臨時外包收入" required>
          </div>
          <div class="mb-3">
            <label class="form-label">金額</label>
            <input type="number" id="tx-amount" class="form-control" min="1" required>
          </div>
          <div class="mb-3">
            <label class="form-label">分類/帳戶</label>
            <select id="tx-account" class="form-select"></select>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
        <button type="button" class="btn btn-primary" onclick="saveTransaction()">儲存並更新</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const STORAGE_KEY = "FINANCE_SYSTEM_DATA_V4";
  const THEME_KEY = "FINANCE_SYSTEM_THEME";
  
  // 核心資料結構
  let appData = {
    accounts: [
      { id: 'acc-1', name: '中國信託', balance: 50000 },
      { id: 'acc-2', name: '現金', balance: 5000 }
    ],
    creditCards: [
      { id: 'cc-1', bank: '國泰世華', title: 'MacBook Pro', totalAmount: 60000, periods: 12, startMonth: '2026-05', perPeriod: 5000 }
    ],
    fixedExpenses: [
      { id: 'fx-1', flowType: 'expense', title: '房屋租金', amount: 15000, cycleType: 'monthly', day: 15 },
      { id: 'fx-2', flowType: 'income', title: '每月固定薪資', amount: 55000, cycleType: 'monthly', day: 5 },
      { id: 'fx-3', flowType: 'expense', title: '汽機車保險', amount: 3600, cycleType: 'yearly', monthNum: 5, day: 20 }
    ],
    monthlyRecords: {}
  };

  let currentMonth = new Date().toISOString().slice(0, 7);
  let txModalInstance = null;

  // 主題切換邏輯
  function initTheme() {
    const savedTheme = localStorage.getItem(THEME_KEY) || "light";
    applyTheme(savedTheme);
  }

  function toggleTheme() {
    const currentTheme = document.documentElement.getAttribute("data-bs-theme");
    const newTheme = currentTheme === "dark" ? "light" : "dark";
    applyTheme(newTheme);
    localStorage.setItem(THEME_KEY, newTheme);
  }

  function applyTheme(theme) {
    document.documentElement.setAttribute("data-bs-theme", theme);
    const icon = document.getElementById("themeIcon");
    const text = document.getElementById("themeText");
    
    if (theme === "dark") {
      icon.className = "fa-solid fa-sun";
      text.innerText = "淺色模式";
    } else {
      icon.className = "fa-solid fa-moon";
      text.innerText = "深色模式";
    }
  }

  document.addEventListener("DOMContentLoaded", () => {
    initTheme();
    txModalInstance = new bootstrap.Modal(document.getElementById('txModal'));
    document.getElementById('selectedMonth').value = currentMonth;
    document.getElementById('cc-start-month').value = currentMonth;
    loadData();
    renderAll();
  });

  function loadData() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      try { appData = JSON.parse(saved); } catch (e) { console.error("Data load error", e); }
    }
  }

  function saveData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
    renderAll();
  }

  function changeMonth() {
    currentMonth = document.getElementById('selectedMonth').value;
    renderAll();
  }

  function toggleFxCycleInputs() {
    const type = document.getElementById('fx-cycle-type').value;
    if (type === 'monthly') {
      document.getElementById('fx-monthly-group').style.display = 'flex';
      document.getElementById('fx-yearly-group').style.display = 'none';
    } else {
      document.getElementById('fx-monthly-group').style.display = 'none';
      document.getElementById('fx-yearly-group').style.display = 'flex';
    }
  }

  function renderAll() {
    document.querySelectorAll('.current-month-label').forEach(el => el.innerText = currentMonth);

    // 1. 生成當月信用卡與固定收支連動
    generateAutoEntriesForMonth(currentMonth);

    // 2. 渲染基礎設定區
    renderAccountsList();
    renderCreditCardsList();
    renderFixedList();

    // 3. 渲染當月明細與統計數據
    renderMonthlyTransactions();
    calculateTopStatistics();
  }

  // 自動推進當月信用卡分期與固定收支
  function generateAutoEntriesForMonth(monthStr) {
    if (!appData.monthlyRecords[monthStr]) {
      appData.monthlyRecords[monthStr] = [];
    }

    let records = appData.monthlyRecords[monthStr];
    const [cYear, cMonth] = monthStr.split('-').map(Number);

    // A. 信用卡分期攤銷
    appData.creditCards.forEach(card => {
      if (!card.startMonth) return;
      const [sYear, sMonth] = card.startMonth.split('-').map(Number);
      const monthDiff = (cYear - sYear) * 12 + (cMonth - sMonth);

      if (monthDiff >= 0 && monthDiff < card.periods) {
        const periodNum = monthDiff + 1;
        const autoId = `auto-cc-${card.id}-${monthStr}`;

        const baseAmount = Math.floor(card.totalAmount / card.periods);
        const remainder = card.totalAmount - (baseAmount * card.periods);
        const currentPeriodAmount = (periodNum === 1) ? (baseAmount + remainder) : baseAmount;

        const existingIndex = records.findIndex(r => r.id === autoId || (r.refType === 'credit' && r.refId === card.id));
        const itemData = {
          id: autoId,
          date: `${monthStr}-01`,
          type: 'expense',
          title: `${card.bank} - ${card.title} [${periodNum}/${card.periods}期]`,
          amount: currentPeriodAmount,
          category: '信用卡分期',
          refType: 'credit',
          refId: card.id
        };

        if (existingIndex >= 0) records[existingIndex] = itemData;
        else records.push(itemData);
      }
    });

    // B. 彈性固定收支 (包含支出與收入)
    appData.fixedExpenses.forEach(fx => {
      let isMatchMonth = false;
      let targetDay = fx.day || 1;

      if (fx.cycleType === 'monthly') {
        isMatchMonth = true;
      } else if (fx.cycleType === 'yearly') {
        if (parseInt(fx.monthNum) === cMonth) {
          isMatchMonth = true;
        }
      }

      if (isMatchMonth) {
        const formattedDay = String(targetDay).padStart(2, '0');
        const autoId = `auto-fx-${fx.id}-${monthStr}`;
        const existingIndex = records.findIndex(r => r.id === autoId || (r.refType === 'fixed' && r.refId === fx.id));
        
        const isIncome = (fx.flowType === 'income');
        const itemData = {
          id: autoId,
          date: `${monthStr}-${formattedDay}`,
          type: isIncome ? 'income' : 'expense',
          title: `[固定${isIncome ? '收入' : '支出'}] ${fx.title}`,
          amount: fx.amount,
          category: isIncome ? '固定收入' : '固定支出',
          refType: 'fixed',
          refId: fx.id,
          dueDate: `${monthStr}-${formattedDay}`
        };

        if (existingIndex >= 0) records[existingIndex] = itemData;
        else records.push(itemData);
      }
    });
  }

  // 計算頂部儀表板數據
  function calculateTopStatistics() {
    const totalAssets = appData.accounts.reduce((sum, a) => sum + (parseFloat(a.balance) || 0), 0);
    document.getElementById('stat-total-assets').innerText = `$${totalAssets.toLocaleString()}`;
    document.getElementById('stat-assets-count').innerText = `含 ${appData.accounts.length} 個帳戶`;

    const monthList = appData.monthlyRecords[currentMonth] || [];
    const monthExpense = monthList
      .filter(item => item.type === 'expense')
      .reduce((sum, item) => sum + (parseFloat(item.amount) || 0), 0);
    document.getElementById('stat-month-expense').innerText = `$${monthExpense.toLocaleString()}`;

    let totalUnpaid = appData.creditCards.reduce((sum, c) => sum + (parseFloat(c.totalAmount) || 0), 0);
    document.getElementById('stat-credit-unpaid').innerText = `$${totalUnpaid.toLocaleString()}`;
    document.getElementById('stat-credit-count').innerText = `${appData.creditCards.length} 筆進行中分期`;

    // 計算預估固定支出與固定收入平攤金額
    let fixedMonthlyExp = 0;
    let fixedMonthlyInc = 0;

    appData.fixedExpenses.forEach(fx => {
      const amt = parseFloat(fx.amount) || 0;
      const isInc = (fx.flowType === 'income');
      
      let monthlyVal = 0;
      if (fx.cycleType === 'monthly') monthlyVal = amt;
      else if (fx.cycleType === 'yearly') monthlyVal = amt / 12;

      if (isInc) fixedMonthlyInc += monthlyVal;
      else fixedMonthlyExp += monthlyVal;
    });

    document.getElementById('stat-fixed-monthly-exp').innerText = `-$${Math.round(fixedMonthlyExp).toLocaleString()}`;
    document.getElementById('stat-fixed-monthly-inc').innerText = `+$${Math.round(fixedMonthlyInc).toLocaleString()}`;
  }

  // 渲染基礎設定列表
  function renderAccountsList() {
    const list = document.getElementById('list-accounts');
    list.innerHTML = appData.accounts.map(acc => `
      <li class="list-group-item d-flex justify-content-between align-items-center px-0 bg-transparent">
        <span>${acc.name}</span>
        <div>
          <span class="fw-bold text-success me-2">$${Number(acc.balance).toLocaleString()}</span>
          <button class="btn btn-link text-danger p-0" onclick="deleteAccount('${acc.id}')"><i class="fa-solid fa-trash-can"></i></button>
        </div>
      </li>
    `).join('');
  }

  function renderCreditCardsList() {
    const list = document.getElementById('list-creditcards');
    list.innerHTML = appData.creditCards.map(cc => `
      <li class="list-group-item px-0 bg-transparent">
        <div class="d-flex justify-content-between align-items-center">
          <strong style="color: #6f42c1;">[${cc.bank}] ${cc.title}</strong>
          <button class="btn btn-link text-danger p-0" onclick="deleteCreditCard('${cc.id}')"><i class="fa-solid fa-trash-can"></i></button>
        </div>
        <div class="d-flex justify-content-between text-muted small mt-1">
          <span>總計: $${Number(cc.totalAmount).toLocaleString()} (${cc.periods}期)</span>
          <span>起始: ${cc.startMonth}</span>
        </div>
      </li>
    `).join('');
  }

  function renderFixedList() {
    const list = document.getElementById('list-fixed');
    list.innerHTML = appData.fixedExpenses.map(fx => {
      const isInc = (fx.flowType === 'income');
      const cycleDesc = fx.cycleType === 'monthly' ? `每月 ${fx.day} 日` : `每年 ${fx.monthNum}/${fx.day} 日`;
      return `
        <li class="list-group-item d-flex justify-content-between align-items-center px-0 bg-transparent">
          <div>
            <div>
              <span class="badge ${isInc ? 'badge-fixed-inc' : 'badge-fixed-exp'} me-1">${isInc ? '收入' : '支出'}</span>
              <strong>${fx.title}</strong>
            </div>
            <div class="text-muted small">${cycleDesc}</div>
          </div>
          <div>
            <span class="fw-bold ${isInc ? 'text-success' : 'text-danger'} me-2">${isInc ? '+' : '-'}$${Number(fx.amount).toLocaleString()}</span>
            <button class="btn btn-link text-danger p-0" onclick="deleteFixedExpense('${fx.id}')"><i class="fa-solid fa-trash-can"></i></button>
          </div>
        </li>
      `;
    }).join('');
  }

  // CRUD 功能邏輯
  function addAccount() {
    const name = document.getElementById('acc-name').value.trim();
    const bal = parseFloat(document.getElementById('acc-bal').value) || 0;
    if (!name) return alert('請輸入帳戶名稱');
    appData.accounts.push({ id: 'acc-' + Date.now(), name, balance: bal });
    document.getElementById('acc-name').value = '';
    document.getElementById('acc-bal').value = '';
    saveData();
  }

  function deleteAccount(id) {
    if (confirm('確定刪除此帳戶？')) {
      appData.accounts = appData.accounts.filter(a => a.id !== id);
      saveData();
    }
  }

  function addCreditCard() {
    const bank = document.getElementById('cc-bank').value.trim();
    const title = document.getElementById('cc-title').value.trim();
    const totalAmount = parseFloat(document.getElementById('cc-amount').value) || 0;
    const periods = parseInt(document.getElementById('cc-periods').value) || 1;
    const startMonth = document.getElementById('cc-start-month').value;

    if (!bank || !title || totalAmount <= 0 || !startMonth) return alert('請完整填寫信用卡分期資訊！');

    appData.creditCards.push({
      id: 'cc-' + Date.now(),
      bank, title, totalAmount, periods, startMonth,
      perPeriod: Math.round(totalAmount / periods)
    });

    document.getElementById('cc-bank').value = '';
    document.getElementById('cc-title').value = '';
    document.getElementById('cc-amount').value = '';
    document.getElementById('cc-periods').value = '';
    saveData();
  }

  function deleteCreditCard(cardId) {
    if (confirm('確定刪除此筆信用卡分期？所有月份對應的扣款紀錄將一併清除！')) {
      appData.creditCards = appData.creditCards.filter(c => c.id !== cardId);
      Object.keys(appData.monthlyRecords).forEach(m => {
        appData.monthlyRecords[m] = appData.monthlyRecords[m].filter(item => !(item.refType === 'credit' && item.refId === cardId));
      });
      saveData();
    }
  }

  function addFixedExpense() {
    const flowType = document.getElementById('fx-flow-type').value;
    const title = document.getElementById('fx-title').value.trim();
    const amount = parseFloat(document.getElementById('fx-amount').value) || 0;
    const cycleType = document.getElementById('fx-cycle-type').value;

    if (!title || amount <= 0) return alert('請填寫完整項目名稱與金額！');

    let fxItem = { id: 'fx-' + Date.now(), flowType, title, amount, cycleType };

    if (cycleType === 'monthly') {
      const day = parseInt(document.getElementById('fx-day').value);
      if (!day || day < 1 || day > 31) return alert('請輸入有效的日期 (1-31)！');
      fxItem.day = day;
    } else {
      const monthNum = parseInt(document.getElementById('fx-month-num').value);
      const dayNum = parseInt(document.getElementById('fx-day-num').value);
      if (!monthNum || monthNum < 1 || monthNum > 12 || !dayNum || dayNum < 1 || dayNum > 31) {
        return alert('請輸入有效的月份 (1-12) 與日期 (1-31)！');
      }
      fxItem.monthNum = monthNum;
      fxItem.day = dayNum;
    }

    appData.fixedExpenses.push(fxItem);
    document.getElementById('fx-title').value = '';
    document.getElementById('fx-amount').value = '';
    saveData();
  }

  function deleteFixedExpense(id) {
    if (confirm('確定刪除此固定收支設定？')) {
      appData.fixedExpenses = appData.fixedExpenses.filter(f => f.id !== id);
      Object.keys(appData.monthlyRecords).forEach(m => {
        appData.monthlyRecords[m] = appData.monthlyRecords[m].filter(item => !(item.refType === 'fixed' && item.refId === id));
      });
      saveData();
    }
  }

  // 渲染每月明細列表與提醒狀態
  function renderMonthlyTransactions() {
    const tbody = document.getElementById('month-transaction-list');
    const records = appData.monthlyRecords[currentMonth] || [];

    if (records.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-4">本月尚無任何收支紀錄</td></tr>`;
      return;
    }

    const todayStr = new Date().toISOString().slice(0, 10);

    tbody.innerHTML = records.map(item => {
      const isIncome = (item.type === 'income');
      
      let badgeClass = 'bg-secondary';
      if (item.refType === 'credit') badgeClass = 'badge-bank';
      else if (item.refType === 'fixed') badgeClass = isIncome ? 'badge-fixed-inc' : 'badge-fixed-exp';
      else if (isIncome) badgeClass = 'bg-success';

      // 警示提醒天數計算
      let reminderBadge = '';
      if (item.refType === 'fixed' && item.dueDate) {
        const due = new Date(item.dueDate);
        const today = new Date(todayStr);
        const diffDays = Math.ceil((due - today) / (1000 * 60 * 60 * 24));

        if (diffDays === 0) {
          reminderBadge = `<span class="badge badge-due-warning"><i class="fa-solid fa-triangle-exclamation me-1"></i>今日到期/入帳</span>`;
        } else if (diffDays > 0) {
          reminderBadge = `<span class="badge badge-due-info"><i class="fa-solid fa-clock me-1"></i>剩 ${diffDays} 天</span>`;
        } else {
          reminderBadge = `<span class="text-muted small">日期: ${item.dueDate.slice(5)}</span>`;
        }
      } else {
        reminderBadge = `<span class="text-muted small">${item.refType ? '自動連動' : '手動輸入'}</span>`;
      }

      return `
        <tr>
          <td>${item.date}</td>
          <td><span class="badge ${badgeClass}">${item.category || (isIncome ? '收入' : '支出')}</span></td>
          <td class="fw-bold">${item.title}</td>
          <td>${reminderBadge}</td>
          <td class="text-end fw-bold ${isIncome ? 'text-success' : 'text-danger'}">
            ${isIncome ? '+' : '-'}$${Number(item.amount).toLocaleString()}
          </td>
          <td class="text-center">
            ${item.refType ? 
              `<button class="btn btn-sm btn-outline-danger" onclick="deleteLinkedItem('${item.refType}', '${item.refId}')" title="刪除主設定並連動清除"><i class="fa-solid fa-trash"></i></button>` :
              `<button class="btn btn-sm btn-outline-danger" onclick="deleteTransaction('${item.id}')"><i class="fa-solid fa-trash"></i></button>`
            }
          </td>
        </tr>
      `;
    }).join('');
  }

  function deleteLinkedItem(refType, refId) {
    if (refType === 'credit') deleteCreditCard(refId);
    else if (refType === 'fixed') deleteFixedExpense(refId);
  }

  function deleteTransaction(txId) {
    if (confirm('確定刪除此筆交易？')) {
      appData.monthlyRecords[currentMonth] = appData.monthlyRecords[currentMonth].filter(t => t.id !== txId);
      saveData();
    }
  }

  function openTransactionModal(type) {
    document.getElementById('txForm').reset();
    document.getElementById('tx-id').value = '';
    document.getElementById('tx-type').value = type;
    document.getElementById('tx-date').value = `${currentMonth}-01`;
    document.getElementById('txModalTitle').innerText = type === 'income' ? '新增收入' : '新增日常支出';

    const accSelect = document.getElementById('tx-account');
    accSelect.innerHTML = appData.accounts.map(a => `<option value="${a.name}">${a.name}</option>`).join('') + '<option value="其他">其他</option>';

    txModalInstance.show();
  }

  function saveTransaction() {
    const id = document.getElementById('tx-id').value || 'tx-' + Date.now();
    const type = document.getElementById('tx-type').value;
    const date = document.getElementById('tx-date').value;
    const title = document.getElementById('tx-title').value.trim();
    const amount = parseFloat(document.getElementById('tx-amount').value) || 0;
    const category = document.getElementById('tx-account').value;

    if (!title || amount <= 0 || !date) return alert('請完整填寫資訊！');

    const targetMonth = date.slice(0, 7);
    if (!appData.monthlyRecords[targetMonth]) appData.monthlyRecords[targetMonth] = [];

    appData.monthlyRecords[targetMonth].push({ id, date, type, title, amount, category });
    
    txModalInstance.hide();
    saveData();
  }

  // 匯出/備份
  function exportJSON() {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData, null, 2));
    const dlAnchor = document.createElement('a');
    dlAnchor.setAttribute("href", dataStr);
    dlAnchor.setAttribute("download", `finance_backup_${new Date().toISOString().slice(0,10)}.json`);
    dlAnchor.click();
  }

  function importJSON(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        appData = JSON.parse(e.target.result);
        saveData();
        alert('資料還原成功！');
      } catch (err) {
        alert('JSON 檔案格式不正確！');
      }
    };
    reader.readAsText(file);
  }

  function exportExcel() {
    const records = appData.monthlyRecords[currentMonth] || [];
    if (records.length === 0) return alert('當月尚無資料可匯出！');

    const dataArr = records.map(r => ({
      "日期": r.date,
      "類型": r.type === 'income' ? '收入' : '支出',
      "項目名稱": r.title,
      "分類/帳戶": r.category,
      "金額": r.amount
    }));

    const ws = XLSX.utils.json_to_sheet(dataArr);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, `${currentMonth} 收支明細`);
    XLSX.writeFile(wb, `財務報表_${currentMonth}.xlsx`);
  }

  function exportPDF() {
    const element = document.getElementById('pdf-export-area');
    const opt = {
      margin:       0.5,
      filename:     `財務報表_${currentMonth}.pdf`,
      image:        { type: 'jpeg', quality: 0.98 },
      html2canvas:  { scale: 2 },
      jsPDF:        { unit: 'in', format: 'a4', orientation: 'portrait' }
    };
    html2pdf().set(opt).from(element).save();
  }
</script>
</body>
</html>
